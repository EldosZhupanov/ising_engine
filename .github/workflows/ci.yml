name: CI

# The engine's guarantees are only real if CI enforces them. This pipeline is
# fail-fast: cheap correctness gates (fmt, clippy) run first, then the full test
# suite, then the golden-regression gate that protects production trajectories.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  memory:
    name: Project Memory Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate document authority, catalogue, links, and frozen evidence
        env:
          MEMORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$MEMORY_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=HEAD^
          fi
          scripts/check_memory_docs.sh "$base"

  # Fast, cheap gates. If formatting or lints fail, don't waste minutes building.
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    needs: memory
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      # --all / --workspace are load-bearing: `workspace_default_members` is the
      # root package alone, so without them the `research/` member is never
      # checked. That gap let a broken target (E0063 in
      # research/src/bin/test_engine.rs) survive indefinitely — CI could not see it.
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Full build + test. Keeps every binary target compilable (--all-targets).
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (whole workspace, all targets — no binary may break)
        run: cargo build --workspace --all-targets
      - name: Test (full suite, whole workspace)
        run: cargo test --workspace --all-targets

  # Documentation must build clean. This gate exists because its absence let 18
  # rustdoc errors accumulate across 9 files — bare `[x]` in prose parsed as
  # intra-doc links, `Vec<Vec<Edge>>` and `<EXP>` as unclosed HTML, and one
  # public->private link. Note rustdoc aborts per crate, so errors cascade: a
  # single clean run only proves the *first* failure is gone. -D warnings makes
  # any new occurrence a hard failure.
  docs:
    name: Rustdoc (deny warnings)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
      - name: Build docs (warnings are errors)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # The correctness firewall: production trajectories and cross-backend
  # bit-identity must never drift. This gate is non-negotiable (CLAUDE.md §4, §9).
  regression:
    name: Golden Regression & Bit-Identity
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Golden regression (production trajectories frozen)
        run: cargo test --release --test test_regression_golden
      - name: Cross-backend bit-identity (SparseBitSlice vs oracle)
        run: cargo test --release --test test_sparse_bitslice_verification
