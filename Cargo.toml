[workspace]
members = ["research"]

[package]
name = "ising_engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eldos/ising_engine"
description = "High-performance combinatorial optimization core for AI-assisted decision systems"
readme = "README.md"

[dependencies]
axum = "0.8.8"
chrono = "0.4.44"
ethers = { version = "2.0.14", features = ["ws"] }
futures = "0.3.32"
rand = "0.8.5"
rand_chacha = "0.3.1"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1.18"

[features]
default = ["parallel"]
parallel = []
simd = []
research = []

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false
